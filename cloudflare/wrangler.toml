name = "prts-stronghold-api"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "api.arknightsprts.ggff.net", custom_domain = true },
  { pattern = "cdn.arknightsprts.ggff.net", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "prts-stronghold-db"
database_id = "d3aac764-0363-4228-a1fb-96b4db217fd6"

[vars]
GITHUB_REPO = "Tenkinoko-Hen/prts-stronghold"
MAX_DAILY_UPLOADS = "10"
WARN_REPORT_THRESHOLD = "3"
HIDE_REPORT_THRESHOLD = "10"
